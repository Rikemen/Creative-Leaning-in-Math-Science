<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oil Timer - p5.js Art Simulator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fbfdff;
      color: #123047;
      font-family: "Avenir Next", "Noto Sans JP", Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    canvas {
      display: block;
    }

    .theme-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      z-index: 3;
      display: flex;
      width: min(980px, calc(100vw - 24px));
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      transform: translateX(-50%);
    }

    .theme-button {
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid rgba(44, 104, 140, 0.24);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: rgba(20, 54, 78, 0.74);
      box-shadow: 0 6px 22px rgba(42, 91, 125, 0.08);
      backdrop-filter: blur(12px);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .theme-button:hover {
      transform: translateY(-1px);
      border-color: rgba(44, 104, 140, 0.48);
      background: rgba(255, 255, 255, 0.9);
    }

    .theme-button.is-active {
      border-color: rgba(9, 105, 160, 0.7);
      background: rgba(229, 248, 255, 0.92);
      color: #075985;
    }

    .hud {
      position: fixed;
      left: clamp(14px, 3vw, 32px);
      bottom: clamp(14px, 3vw, 30px);
      z-index: 2;
      max-width: min(360px, calc(100vw - 28px));
      pointer-events: none;
      color: rgba(18, 48, 71, 0.72);
      text-shadow: 0 2px 18px rgba(255, 255, 255, 0.75);
      transition: opacity 0.5s ease;
    }

    .hud__title {
      margin: 0 0 4px;
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 700;
      letter-spacing: 0;
    }

    .hud__text {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: rgba(50, 88, 113, 0.6);
    }

    body.is-calm .hud {
      opacity: 0.34;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <nav class="theme-bar" aria-label="Oil Timer themes">
    <button class="theme-button is-active" type="button" data-theme="0">Oil Timer Crystal</button>
    <button class="theme-button" type="button" data-theme="1">Oil Timer Lava</button>
    <button class="theme-button" type="button" data-theme="2">Oil Timer Deep</button>
    <button class="theme-button" type="button" data-theme="3">Oil Timer Candy</button>
    <button class="theme-button" type="button" data-theme="4">Oil Timer Mono</button>
    <button class="theme-button" type="button" data-theme="5">Oil Timer Aurora</button>
    <button class="theme-button" type="button" data-theme="6">Oil Timer Lab</button>
    <button class="theme-button" type="button" data-theme="7">Oil Timer Gold</button>
    <button class="theme-button" type="button" data-theme="8">Oil Timer Neon</button>
    <button class="theme-button" type="button" data-theme="9">Oil Timer Ink</button>
    <button class="theme-button" type="button" data-theme="10">Oil Timer Neumo</button>
    <button class="theme-button" type="button" data-theme="11">Oil Timer Liquid</button>
    <button class="theme-button" type="button" data-theme="12">Oil Timer Stair</button>
  </nav>
  <div class="hud" aria-hidden="true">
    <p class="hud__title">Oil Timer</p>
    <p class="hud__text" id="themeDescription">Crystal Bubble: transparent glass, pale drops, and bright reflections.</p>
  </div>
</body>
</html>
