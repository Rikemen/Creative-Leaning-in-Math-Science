<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Rikemen CH.のYouTube動画で共通利用する5秒オープニング"
    />
    <title>Rikemen CH. Opening</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script defer src="timeline-utils.js"></script>
    <script defer src="audio-engine.js"></script>
    <script defer src="recorder.js"></script>
    <script defer src="sketch.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">YouTube channel identity</p>
          <h1>Rikemen CH. Opening</h1>
          <p class="page-description">
            10人のキャラクターと科学の軌道がつくる、5秒の共通オープニングです。
          </p>
        </div>
        <div class="spec-badges" aria-label="動画仕様">
          <span>5.0 sec</span>
          <span>1920×1080</span>
          <span>60 fps</span>
        </div>
      </header>

      <section class="preview-card" aria-labelledby="preview-title">
        <div class="preview-heading">
          <div>
            <p class="section-kicker">Preview</p>
            <h2 id="preview-title">Science Orbit</h2>
          </div>
          <p id="statusText" class="status-text" role="status" aria-live="polite">
            読み込み中…
          </p>
        </div>

        <div id="canvasHost" class="canvas-host" aria-label="Rikemen CH. opening preview"></div>

        <div class="timeline-control">
          <label for="frameSlider">Frame</label>
          <input
            id="frameSlider"
            type="range"
            min="0"
            max="299"
            value="0"
            step="1"
            aria-label="確認するフレーム"
          />
          <output id="frameOutput" for="frameSlider">000 / 299</output>
        </div>

        <div class="action-row">
          <button id="replayButton" class="button button-primary" type="button">
            音付きで再生
          </button>
          <button id="recordButton" class="button button-secondary" type="button">
            5秒を録画（WebM）
          </button>
        </div>
      </section>

      <aside class="export-note">
        <p class="export-note-title">MP4に仕上げるには</p>
        <p>
          WebMを録画後、READMEに記載したFFmpegコマンドでH.264/AACの5秒動画へ変換できます。
        </p>
      </aside>
    </main>
  </body>
</html>
